services:
  - type: web
    name: elpis-app
    env: node
    plan: free
    buildCommand: "cd interface/web && npm install --include=dev && npm run build && cd ../bridge && npm install"
    startCommand: "cd interface/bridge && node server.js"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_PATH
        value: python3
