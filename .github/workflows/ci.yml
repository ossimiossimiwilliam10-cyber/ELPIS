name: CI - Test, Lint & Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./interface/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: interface/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage (Vitest)
        run: npx vitest run --coverage --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: interface/web/playwright-report/

      - name: Upload Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: interface/web/coverage/

      - name: Build check
        run: npm run build

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./interface/bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: interface/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bridge tests with coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload Bridge Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-coverage
          path: interface/bridge/coverage/

  python-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Run agent_audit tests
        run: python -m pytest agent_audit/ --tb=short -q
