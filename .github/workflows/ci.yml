name: CI - Test & Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./interface/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: interface/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "Lint warnings — non-bloquant"

      - name: Unit tests (Vitest)
        run: npm test -- --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npx playwright test --reporter=html || echo "E2E warnings — vérifier le rapport"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: interface/web/playwright-report/

      - name: Build check
        run: npm run build

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./interface/bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: interface/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bridge tests
        run: npm test || echo "No bridge tests configured yet"
